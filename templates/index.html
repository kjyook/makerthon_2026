<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>UAM Risk Management - Cesium Ion Edition</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <!-- Drone class script -->
    <script src="{{ url_for('static', filename='js/drone.js') }}"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        
        .control-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); padding: 20px;
            border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: 'Malgun Gothic', sans-serif;
        }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 11px; font-weight: bold; }
        .input-group input { width: 100%; padding: 6px; box-sizing: border-box; }
        button {
            width: 100%; padding: 10px; margin-top: 8px; cursor: pointer;
            border: none; border-radius: 6px; font-weight: bold; color: white;
        }
        #status { margin-top: 15px; font-size: 11px; color: #333; border-top: 1px solid #ccc; padding-top: 10px; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div class="control-panel">
        <h4 style="margin:0 0 10px 0; color: #1a4d2e;">UAM 송도 관제 (Cesium)</h4>
        <div class="input-group">
            <label>출발 Voxel (x,y,z):</label>
            <input id="start" value="20,20,10">
        </div>
        <div class="input-group">
            <label>도착 Voxel (x,y,z):</label>
            <input id="end" value="120,120,10">
        </div>
        <div class="input-group">
            <label>풍속 (m/s):</label>
            <input type="number" id="wind-speed" value="8.0">
        </div>
        <div class="input-group">
            <label>풍향 (deg):</label>
            <input type="number" id="wind-direction" value="90.0">
        </div>

        <button onclick="loadRiskMap()" style="background: #e67e22;">1. 위험 격자 생성</button>
        <button onclick="findRoute()" style="background: #27ae60;">2. 최적 경로 탐색</button>
        <button id="btnLaunch" onclick="launchDrone()" style="background: #3498db; display: none;">3. 드론 비행 개시</button>
        <button id="btnReturn" onclick="returnDrone()" style="background: #e74c3c; display: none;">4. 출발지로 돌아가기</button>
        
        <div id="status">송도 구역 준비 완료</div>
    </div>

    <script>
      // 전역 변수 선언
      let routeEntity = null;
      let riskEntities = [];
      let drone = null;
// 드론 출발 함수
function launchDrone() {
    if (drone) {
        drone.startFlight();
        document.getElementById('status').innerText = "드론 비행 시작!";
        document.getElementById('btnLaunch').style.display = 'none';
        document.getElementById('btnReturn').style.display = 'block'; // 즉시 복귀 버튼 표시
    }
}

// 드론 복귀 함수 (즉시 이동)
function returnDrone() {
    if (drone) {
        drone.returnToOrigin();
        document.getElementById('status').innerText = "출발지로 즉시 복귀했습니다.";
        document.getElementById('btnReturn').style.display = 'none';
        document.getElementById('btnLaunch').style.display = 'block';
    }
}

// 드론 도착 시 호출되는 콜백
window.onDroneArrived = function() {
    const statusEl = document.getElementById('status');
    if (drone.status === 'Arrived') {
        statusEl.innerText = "도착지에 도달했습니다.";
    } else if (drone.status === 'Ready (At Origin)') {
        statusEl.innerText = "준비 완료 (출발지)";
        document.getElementById('btnReturn').style.display = 'none';
        document.getElementById('btnLaunch').style.display = 'block';
    }
};

      // 1. Flask에서 보낸 토큰을 안전하게 받기
      // 만약 Flask가 None을 보내면 자바스크립트에서는 빈 문자열이 됩니다.
      const tokenFromFlask = "{{ cesium_token or '' }}";

      // 2. 토큰 결정 (Flask 우선, 없으면 하드코딩된 백업 사용)
      const BACKUP_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxZTRlOGViNy1lMWQwLTQ0ZjEtOWUzYi1lZTZlYmMyMDlhMDciLCJpZCI6NDI4MzE5LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3NzgxNDA3MzZ9.sHjhX9fEGcVsEHY2fki5lozfM2jAKwWkD9kS6sFYi4Q";

      const ION_TOKEN = (tokenFromFlask && tokenFromFlask !== "None" && tokenFromFlask.length > 10) 
                        ? tokenFromFlask.trim() 
                        : BACKUP_TOKEN;

      // 3. Cesium 토큰 설정
      Cesium.Ion.defaultAccessToken = ION_TOKEN;

      console.log("사용 중인 토큰:", ION_TOKEN.substring(0, 10) + "...");

      // 4. 뷰어 초기화 (배경 지도 강제 로드)
      const viewer = new Cesium.Viewer('cesiumContainer', {
          terrainProvider: Cesium.createWorldTerrain(),
          animation: true,
          timeline: true,
          baseLayerPicker: true,
          sceneModePicker: false,
          osmBuildings: true,
          infoBox: true, // 상태창 활성화
          selectionIndicator: true
      });
      viewer.scene.globe.depthTestAgainstTerrain = true;

      // 드론 객체 초기화
      drone = new Drone(viewer);

      // 3D 건물 명시적 추가
      viewer.scene.primitives.add(Cesium.createOsmBuildings());

      // 송도 센트럴파크 구역으로 카메라 설정
      viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(126.639, 37.392, 1800),
          orientation: { pitch: Cesium.Math.toRadians(-45) }
      });

        // 위험 격자 생성 로직
        async function loadRiskMap() {
          const statusEl = document.getElementById('status');
          const windSpeed = document.getElementById('wind-speed').value;
          const windDirection = document.getElementById('wind-direction').value;
          
          statusEl.innerText = "서버에서 송도 물리 데이터를 가져오는 중...";

          try {
              const response = await fetch(`/api/risk-map?wind_speed=${windSpeed}&wind_direction=${windDirection}&threshold=0.4`);
              if (!response.ok) throw new Error(`HTTP 에러! 상태코드: ${response.status}`);
              
              const data = await response.json();

              // 2. 기존 격자 제거
              riskEntities.forEach(e => viewer.entities.remove(e));
              riskEntities = [];

              // 3. Voxel 생성
              if (data.points && data.points.length > 0) {
                  data.points.forEach(p => {
                      const [lon, lat, alt] = voxelToLonLatAlt(p.x, p.y, p.z);
                      
                      const entity = viewer.entities.add({
                          position: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
                          box: {
                              dimensions: new Cesium.Cartesian3(10, 10, 10), 
                              material: Cesium.Color.ORANGE.withAlpha(Math.min(0.95, p.risk)),
                              outline: false,
                              disableDepthTestDistance: Number.POSITIVE_INFINITY 
                          }
                      });
                      riskEntities.push(entity);
                  });
                  statusEl.innerText = `위험 격자 ${riskEntities.length}개 생성 완료! (10m 해상도)`;
              } else {
                  statusEl.innerText = "위험 지역이 없습니다. 풍속을 조절해보세요.";
              }

          } catch (e) {
              console.error("Voxel 생성 에러:", e);
              statusEl.innerText = "오류 발생: " + e.message;
          }
      }
      // Voxel 인덱스를 실제 지도 좌표(위경도, 고도)로 변환하는 함수
      function voxelToLonLatAlt(x, y, z) {
          const baseLon = 126.6300; 
          const baseLat = 37.3850;  
          const lonStep = 0.00012; 
          const latStep = 0.00009;
          
          return [
              baseLon + x * lonStep, 
              baseLat + y * latStep, 
              5 + z * 10
          ];
      }

        // 경로 탐색 로직
        async function findRoute() {
            const statusEl = document.getElementById('status');
            const startVal = document.getElementById('start').value.split(',').map(v => parseInt(v.trim()));
            const endVal = document.getElementById('end').value.split(',').map(v => parseInt(v.trim()));
            const windSpeed = Number(document.getElementById('wind-speed').value);
            const windDirection = Number(document.getElementById('wind-direction').value);

            if (startVal.length !== 3 || endVal.length !== 3 || startVal.some(isNaN) || endVal.some(isNaN)) {
                statusEl.innerText = "좌표 형식이 올바르지 않습니다 (x,y,z)";
                return;
            }

            statusEl.innerText = "경로 탐색 중...";

            try {
                const response = await fetch('/api/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: startVal, 
                        end: endVal,
                        wind_speed: windSpeed,
                        wind_direction: windDirection, 
                        vehicle_type: 'passenger'
                    })
                });
                
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || `서버 오류 (상태코드: ${response.status})`);
                }

                if (routeEntity) viewer.entities.remove(routeEntity);

                const positions = data.path.map(p => {
                    const [lon, lat, alt] = voxelToLonLatAlt(p[0], p[1], p[2]);
                    return Cesium.Cartesian3.fromDegrees(lon, lat, alt);
                });

                routeEntity = viewer.entities.add({
                    polyline: {
                        positions: positions,
                        width: 8,
                        material: Cesium.Color.SPRINGGREEN,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY 
                    }
                });

                // 드론 애니메이션 설정 (대기 상태)
                if (drone) {
                    drone.setPath(positions);
                    document.getElementById('btnLaunch').style.display = 'block'; // 버튼 표시
                }

                statusEl.innerText = `탐색 성공! 위험도: ${data.average_risk.toFixed(3)}`;
                viewer.zoomTo(routeEntity);
            } catch (e) { 
                console.error("경로 탐색 에러:", e);
                statusEl.innerText = "경로 탐색 실패: " + e.message; 
            }
        }

        // 클릭 상태 관리를 위한 변수
      let isSelectingStart = true;
      let startMarker = null;
      let endMarker = null;

      // 1. 역변환 함수: 위경도/고도를 Voxel 인덱스(x,y,z)로 변환
      function lonLatAltToVoxel(lon, lat, alt) {
          const baseLon = 126.6300;
          const baseLat = 37.3850;
          const lonStep = 0.00012;
          const latStep = 0.00009;
          
          const x = Math.round((lon - baseLon) / lonStep);
          const y = Math.round((lat - baseLat) / latStep);
          const z = Math.round((alt - 5) / 10);
          
          return [x, y, z];
      }

      // 2. Cesium 클릭 핸들러 등록
      const clickHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

      clickHandler.setInputAction(function(click) {
          const ray = viewer.camera.getPickRay(click.position);
          const cartesian = viewer.scene.globe.pick(ray, viewer.scene);

          if (Cesium.defined(cartesian)) {
              const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
              const lon = Cesium.Math.toDegrees(cartographic.longitude);
              const lat = Cesium.Math.toDegrees(cartographic.latitude);
              const alt = cartographic.height;

              const [vx, vy, vz] = lonLatAltToVoxel(lon, lat, alt);
              const voxelStr = `${vx},${vy},${vz < 0 ? 0 : vz}`; 

              if (isSelectingStart) {
                  document.getElementById('start').value = voxelStr;
                  if (startMarker) viewer.entities.remove(startMarker);
                  startMarker = viewer.entities.add({
                      position: cartesian,
                      point: { pixelSize: 15, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                      label: { text: "출발지", font: '14px sans-serif', verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -15) }
                  });
                  document.getElementById('status').innerText = "출발지 설정 완료! 이제 도착지를 클릭하세요.";
                  isSelectingStart = false;
              } else {
                  document.getElementById('end').value = voxelStr;
                  if (endMarker) viewer.entities.remove(endMarker);
                  endMarker = viewer.entities.add({
                      position: cartesian,
                      point: { pixelSize: 15, color: Cesium.Color.BLUE, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                      label: { text: "도착지", font: '14px sans-serif', verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -15) }
                  });
                  document.getElementById('status').innerText = "도착지 설정 완료! '위험 격자 생성' 버튼을 눌러주세요.";
                  isSelectingStart = true;
              }
          }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    </script>
</body>
</html>
