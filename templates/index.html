<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAM 3D Risk Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #f6f4ef;
        --bg-2: #e6efe9;
        --ink: #12261d;
        --accent: #d06f2f;
        --accent-2: #2d6a4f;
        --card: rgba(255, 255, 255, 0.86);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: "Space Grotesk", sans-serif; color: var(--ink); }
      body {
        background: radial-gradient(circle at 20% 15%, #fef7e7 0%, var(--bg-1) 40%),
          radial-gradient(circle at 80% 70%, #dceee2 0%, var(--bg-2) 45%);
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(18, 38, 29, 0.12);
        backdrop-filter: blur(6px);
        background: rgba(255, 255, 255, 0.55);
      }
      header h1 { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; }
      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 0;
      }
      .panel {
        padding: 16px;
        background: var(--card);
        border-right: 1px solid rgba(18, 38, 29, 0.1);
        overflow: auto;
      }
      .panel h2 { margin: 6px 0 12px; font-size: 1rem; }
      .group { margin-bottom: 12px; }
      label { display: block; margin-bottom: 4px; font-size: 0.9rem; }
      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(18, 38, 29, 0.25);
        background: #fff;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), #b94f1a);
      }
      button.secondary {
        margin-top: 8px;
        background: linear-gradient(135deg, var(--accent-2), #20513b);
      }
      #status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
        font-size: 0.88rem;
        background: rgba(208, 111, 47, 0.1);
      }
      #viewer { width: 100%; height: 100%; min-height: 420px; }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .panel { border-right: 0; border-bottom: 1px solid rgba(18, 38, 29, 0.1); }
      }
    </style>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>UAM 3D Risk Visualization Prototype</h1>
    </header>
    <main>
      <aside class="panel">
        <h2>Scenario Input</h2>
        <div class="group">
          <label for="start">Start (x,y,z)</label>
          <input id="start" value="2,2,6" />
        </div>
        <div class="group">
          <label for="end">End (x,y,z)</label>
          <input id="end" value="28,28,6" />
        </div>
        <div class="group">
          <label for="windSpeed">Wind Speed</label>
          <input id="windSpeed" type="number" step="0.1" value="8" />
        </div>
        <div class="group">
          <label for="windDirection">Wind Direction</label>
          <input id="windDirection" type="number" step="1" value="90" />
        </div>
        <button id="btnRoute">Find Route</button>
        <button id="btnRisk" class="secondary">Load Risk Voxels</button>
        <div id="status">Grid: {{ grid_shape }}</div>
      </aside>
      <section id="viewer"></section>
    </main>
    <script>
      window.APP_GRID_SHAPE = {{ grid_shape | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  </body>
</html>
