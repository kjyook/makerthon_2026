<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>VWorld WebGL 3D API 3.0 Sample</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script type="text/javascript" src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=10235D2E-E135-3D04-B51E-1052734DE2B0"></script> 
        <style type="text/css">
            table{
                border-collapse: separate;
                border-spacing: 0;
                text-align: left;
                line-height: 1.5;
                border-top: 1px solid #ccc;
                border-left: 1px solid #ccc;
                margin: 20px 10px;
            }
            table th{
                width: 150px;
                padding: 10px;
                font-weight: bold;
                vertical-align: top;
                border-right: 1px solid #ccc;
                border-bottom: 1px solid #ccc;
                border-top: 1px solid #fff;
                border-left: 1px solid #fff;
                background: #eee;
            }
            table td{
                padding: 10px;
                vertical-align: top;
                border-right: 1px solid #ccc;
                border-bottom: 1px solid #ccc;
            }
            </style>
    </head>
        <body style="margin: 0; padding: 0;">
            <div id="vmap" style="width: 100vw; height: 100vh;"></div>
        <script>
            var map;
            
            $(function() {
                // 지도 생성 옵션 설정
                var options = {
                    mapId : "vmap",
                    initPosition : new vw.CameraPosition(
                        new vw.CoordZ(126.6385, 37.3945, 400), // 초기 카메라 위치 (위도, 경도, 고도)
                        new vw.Direction(0, -35, 0) // 비스듬하게
                    ),
                    logo: true,
                    navigation: true
                };
                
                // 지도 객체 생성 및 시작
                map = new vw.Map();   
                map.setOption(options);
                map.start();
            });
        </script>
    </body>
</html>
